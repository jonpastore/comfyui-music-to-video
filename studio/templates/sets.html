{% extends "base.html" %}
{% block content %}
<h1>Sets</h1>
<p class="hint">A set is a document: songs in an order, each with its own trim, gain and
  transition. Create one to open the editor.</p>

<form method="post" action="/sets/new" class="new-playlist-bar">
  <label>New set
    <input type="text" name="name" required placeholder="set name">
  </label>
  <label>Mode
    <select name="mode">
      <option value="video">Audio + video</option>
      <option value="audio">Audio only</option>
    </select>
  </label>
  <label>From playlist
    <select name="playlist_id">
      <option value="">(none)</option>
      {% for p in playlists %}
      <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Create</button>
</form>
<p class="empty">No sets yet.</p>
{% endblock %}
