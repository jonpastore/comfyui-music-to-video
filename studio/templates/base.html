<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meow P Studio{% endblock %}</title>
  <!-- the only console error a browser reports on this app: chrome asks for
       /favicon.ico on every page and gets a 404. An empty data: icon answers it
       without shipping a file. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Meow P Studio</a>
    <nav>
      {% for link in nav_links() %}
      <a href="{{ link.href }}">{{ link.label }}</a>
      {% endfor %}
    </nav>
    <button type="button" id="job-chip" class="job-chip" data-open-jobs
            aria-haspopup="dialog" aria-controls="jobs-modal"
            hx-get="/queue?chip=1" hx-trigger="load" hx-swap="outerHTML">
      <span class="muted">jobs</span>
    </button>
  </header>
  <dialog class="jobs-modal" id="jobs-modal">
    <div class="modal-bar">
      <strong>Jobs</strong>
      <span>
        <a href="/jobs">all jobs</a>
        <button type="button" class="secondary"
                onclick="this.closest('dialog').close()">Close</button>
      </span>
    </div>
    <div id="jobs-modal-body"></div>
  </dialog>
  <dialog class="lightbox" id="ref-preview">
    <div class="lightbox-bar">
      <strong id="ref-preview-label"></strong>
      <button type="button" class="secondary lightbox-close"
              onclick="this.closest('dialog').close()">Close</button>
    </div>
    <img alt="full size">
  </dialog>
  <dialog class="video-modal" id="clip-preview">
    <div class="modal-bar">
      <strong id="clip-preview-label">Clip</strong>
      <button type="button" class="secondary"
              onclick="this.closest('dialog').close()">Close</button>
    </div>
    <video controls preload="metadata"></video>
  </dialog>
  <div id="page-loading" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="page-loading-label">Loading&hellip;</span>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
